site_name: MACC Lab Documentation
site_description: Technical documentation for MACC Lab computing, HPC access, Open OnDemand, Slurm, and research workflows.
site_url: https://macclab-stevens.github.io/wiki/
repo_url: https://github.com/macclab-stevens/wiki
repo_name: macclab-stevens/wiki
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/olcf-ish.css

extra_javascript:
  - javascripts/extra.js

theme:
  name: material
  logo: images/logo.svg
  favicon: images/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

validation:
  nav:
    omitted_files: info

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Accounts: getting-started/accounts.md
      - SSH Access: getting-started/ssh.md
      - First Login: getting-started/first-login.md
  - HPC Cluster:
      - Overview: hpc/index.md
      - Storage: hpc/storage.md
      - Open OnDemand:
          - Overview: open-ondemand/index.md
          - Jupyter: open-ondemand/jupyter.md
          - VS Code: open-ondemand/vscode.md
          - Troubleshooting: open-ondemand/troubleshooting.md
      - Slurm:
          - Slurm Basics: hpc/slurm.md
          - Interactive Jobs: hpc/interactive-jobs.md
          - GPU Jobs: hpc/gpu-jobs.md
          - Common Errors: hpc/common-errors.md
  - Software:
      - Overview: software/index.md
      - Python: software/python.md
      - Conda / Mamba: software/conda-mamba.md
      - Containers: software/containers.md
      - PyTorch / TensorFlow: software/pytorch-tensorflow.md
  - Lab Guides:
      - Overview: lab-guides/index.md
      - Onboarding: lab-guides/onboarding.md
      - GitHub Workflow: lab-guides/github-workflow.md
      - Data Storage Rules: lab-guides/data-storage-rules.md
      - Equipment: lab-guides/equipment.md
  - Troubleshooting:
      - Overview: troubleshooting/index.md
      - Open OnDemand: troubleshooting/open-ondemand.md
      - Slurm: troubleshooting/slurm.md
      - Python Environments: troubleshooting/python-environments.md
      - GPU: troubleshooting/gpu.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Git Setup and Workflow: tutorials/git-workflow.md
      - 5G gNB Setup (B210 + Open5GS): tutorials/5g-gnb-b210-open5gs.md
      - srsUE on Raspberry Pi 5 (bladeRF): tutorials/srsue-rpi5-bladerf.md
      - UE iperf3 Testing: tutorials/ue-iperf3.md
      - SIM Card Provisioning: tutorials/simcard-provisioning.md
      - FN990A28 5G Modem Setup: tutorials/fn990a28-modem.md
      - Drone - Voxel Flight 2 (5G Deck): tutorials/drone-voxel-5g.md
      - UML in GitHub: tutorials/uml-github.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
